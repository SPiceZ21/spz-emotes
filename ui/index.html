<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>spz-emotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="hidden">
    <section class="panel">
      <header>
        <h1>Emotes</h1>
        <button id="close" title="Close (Esc)">✕</button>
      </header>

      <div class="search">
        <input id="q" type="text" placeholder="Search emotes…" spellcheck="false" autocomplete="off">
      </div>

      <nav id="cats"></nav>

      <div id="grid"></div>

      <footer>
        <div id="now"><span class="dot"></span><span id="nowLabel">Nothing playing</span></div>
        <button id="stop">Stop <kbd id="cancelKey">X</kbd></button>
      </footer>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
